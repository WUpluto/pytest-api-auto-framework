# 新增员工接口的数据驱动用例
- case_title: "正常添加员工_预期成功"
  payload:
    name: "张三"
    department_id: 101
    phone: "13800138000"
  expected_status: 200
  expected_code: 0
  expected_msg: "success"

- case_title: "添加员工_手机号为空_预期失败"
  payload:
    name: "李四"
    department_id: 102
    phone: ""
  expected_status: 200
  expected_code: 4001
  expected_msg: "手机号不能为空"